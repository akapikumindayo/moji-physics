<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文字物理シミュレーター</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            transition: background-color 1s ease, filter 1s ease;
            user-select: none;
            touch-action: none;
            font-family: 'Sawarabi Mincho', 'Hiragino Mincho ProN', 'serif';
        }

        /* Normal Mode (Manuscript) */
        body.normal-mode {
            background-color: #f4ece1;
            background-image: 
                linear-gradient(90deg, rgba(200, 80, 80, 0.15) 1px, transparent 1px),
                linear-gradient(rgba(200, 80, 80, 0.15) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Grayscale Mode */
        body.grayscale-mode {
            background-color: #e5e5e5;
            background-image: 
                linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            filter: grayscale(100%);
        }

        /* Abyss Mode */
        body.abyss-mode {
            background-color: #000000;
            background-image: none;
            filter: none;
        }

        canvas {
            display: block;
        }

        .controls {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 10px;
            pointer-events: none;
        }
        .controls > * {
            pointer-events: auto;
        }

        .instruction {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #5d4037;
            font-size: 0.8rem;
            text-align: center;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 20px;
            border-radius: 4px;
            border: 1px solid rgba(200, 80, 80, 0.3);
            transition: all 0.5s;
        }
        .grayscale-mode .instruction {
            color: #333;
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #999;
        }
        .abyss-mode .instruction {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #333;
        }

        #backBtn {
            display: none;
        }
        /* ★ zero-gravity-mode のときも backBtn を表示する */
        .abyss-mode #backBtn, .grayscale-mode #backBtn, .zero-gravity-mode #backBtn {
            display: block;
        }
    </style>
</head>
<body class="normal-mode">

    <div class="controls">
        <input type="text" id="wordInput" autocomplete="off" placeholder="文字を入力..." class="px-4 py-2 rounded border border-red-200 bg-white/80 text-black focus:outline-none focus:ring-2 focus:ring-red-400 w-40">
        <button id="addBtn" class="bg-red-700 hover:bg-red-800 text-white px-4 py-2 rounded font-bold shadow-md transition-all active:scale-95">追加</button>
        <button id="clearBtn" class="bg-stone-600 hover:bg-stone-700 text-white px-4 py-2 rounded font-bold shadow-md transition-all active:scale-95">消去</button>
        <button id="backBtn" class="bg-blue-900 hover:bg-blue-800 text-white px-4 py-2 rounded font-bold shadow-md transition-all active:scale-95">戻す</button>
    </div>

    <!-- バーチャルキーボード関連要素（PC向けレイアウトに戻す） -->
    <button id="vkToggleBtn" class="fixed bottom-4 right-4 bg-gray-800 text-white w-12 h-12 flex items-center justify-center rounded-full shadow-lg z-50 transition-transform active:scale-95 text-2xl pointer-events-auto">
        ⌨️
    </button>

    <div id="virtualKeyboard" class="fixed bottom-20 right-4 bg-white/80 backdrop-blur p-4 rounded-lg shadow-xl border border-gray-200 flex flex-col gap-2 z-50 hidden transition-opacity pointer-events-auto">
        <div class="text-sm font-bold text-gray-700 text-center mb-1 border-b pb-1 border-gray-300">バーチャルキーボード</div>
        <div class="grid grid-cols-2 gap-2">
            <button id="vk-rotate-left" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded text-sm shadow active:scale-95 transition-transform">左回転 (←)</button>
            <button id="vk-rotate-right" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded text-sm shadow active:scale-95 transition-transform">右回転 (→)</button>
            <button id="vk-fix" class="bg-yellow-600 hover:bg-yellow-700 text-white font-bold py-2 px-3 rounded text-sm shadow active:scale-95 transition-transform">固定 (k)</button>
            <button id="vk-delete" class="bg-stone-600 hover:bg-stone-700 text-white font-bold py-2 px-3 rounded text-sm shadow active:scale-95 transition-transform">消去 (削除)</button>
            <button id="vk-s" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-3 rounded text-sm shadow active:scale-95 transition-transform">S極 (s)</button>
            <button id="vk-n" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-3 rounded text-sm shadow active:scale-95 transition-transform">N極 (n)</button>
            <button id="vk-board" class="bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-400 font-bold py-2 px-1 rounded text-xs flex flex-col items-center justify-center shadow-sm active:scale-95 transition-transform">
                <span>板</span>
                <span class="text-[10px] opacity-75">(T)</span>
            </button>

            <button id="vk-rope" class="bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-400 font-bold py-2 px-1 rounded text-xs flex flex-col items-center justify-center shadow-sm active:scale-95 transition-transform">
                <span>紐</span>
                <span class="text-[10px] opacity-75">(Y)</span>
            </button>

            <button id="vk-cancel" class="bg-slate-200 hover:bg-slate-300 text-slate-800 border border-slate-400 font-bold py-2 px-1 rounded text-xs flex flex-col items-center justify-center shadow-sm active:scale-95 transition-transform">
                <span>解除</span>
                <span class="text-[10px] opacity-75">(Q)</span>
            </button>
            <div class="col-span-2 flex flex-col gap-1 bg-stone-100 p-2 rounded text-black text-xs font-bold">
    <label for="multiplySpeed">倍の増殖間隔: <span id="speedValue">5</span>秒</label>
    <input type="range" id="multiplySpeed" min="1" max="10" value="5" class="w-full cursor-pointer">
</div>      
            <button id="vk-variable-bounce" class="col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 px-3 rounded text-sm shadow active:scale-95 transition-transform">可変跳躍: OFF (v)</button>
            <button id="vk-wind" class="col-span-2 bg-teal-600 hover:bg-teal-700 text-white font-bold py-2 px-3 rounded text-sm shadow active:scale-95 transition-transform select-none touch-none" style="touch-action: none;">風 (b) ※長押し</button>
        </div>
    </div>

    <div id="statusLabel" class="instruction">
    掴んでホイール回転 / 「k」固定 / 「b」風 / 「y」ゴム紐で連結/ 「t」板で連結/ 「q」選択解除
</div>

    <script>
        // ブラウザの右クリックメニューを禁止する
        window.addEventListener('contextmenu', (e) => e.preventDefault());
        const { Engine, Render, Runner, Bodies, Composite, MouseConstraint, Mouse, Events, World, Body, Vector } = Matter;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let isAbyss = false;
        let isBlowing = false;
        let isBouncing = false;
        let lastGrabbedBody = null; 
        let isVariableBounce = false;
        let linkSourceBody = null; // Yキー連結用の1つ目の文字
let isYKeyPressed = false; // Yキー押下状態
let boardSourceBody = null; // Tキー（板）選択用
let isTKeyPressed = false;

        const BOUNCE_SPEED = 5; 
        const ABYSS_FALL_SPEED = 1.2;

        function playPopSound(freq = 400, type = 'sine', volume = 0.1) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        // 【追加】可変バウンド切り替え関数
        function toggleVariableBounce() {
            isVariableBounce = !isVariableBounce;
            const btn = document.getElementById('vk-variable-bounce');
            if (btn) {
                btn.innerText = `可変跳躍: ${isVariableBounce ? 'ON' : 'OFF'} (v)`;
                btn.className = isVariableBounce 
                    ? "col-span-2 bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2 px-3 rounded text-sm shadow active:scale-95 transition-transform ring-2 ring-emerald-300"
                    : "col-span-2 bg-emerald-700 hover:bg-emerald-800 text-white font-bold py-2 px-3 rounded text-sm shadow active:scale-95 transition-transform";
            }
            playPopSound(isVariableBounce ? 1000 : 500, 'sine', 0.08);
        }

        // 【追加】バーチャルキーボードのボタンイベントリスナー
        document.getElementById('vk-variable-bounce').addEventListener('click', toggleVariableBounce);

        const engine = Engine.create();
        const world = engine.world;
        engine.gravity.y = 1.0; 

        let width = window.innerWidth;
        let height = window.innerHeight;

        const render = Render.create({
            element: document.body,
            engine: engine,
            options: {
                width: width,
                height: height,
                wireframes: false,
                background: 'transparent'
            }
        });

        Render.run(render);
        const runner = Runner.create();
        Runner.run(runner, engine);

        let ground, leftWall, rightWall, ceiling;
        function createWalls() {
            if (ground) Composite.remove(world, [ground, leftWall, rightWall, ceiling]);
            const options = { 
                isStatic: true, 
                restitution: 1, 
                friction: 0,
                render: { visible: false } 
            };
            ground = Bodies.rectangle(width / 2, height + 50, width, 100, options);
            leftWall = Bodies.rectangle(-50, height / 2, 100, height, options);
            rightWall = Bodies.rectangle(width + 50, height / 2, 100, height, options);
            ceiling = Bodies.rectangle(width / 2, -150, width, 100, options);
            Composite.add(world, [ground, leftWall, rightWall, ceiling]);
            
            if (isAbyss) {
                ground.isSensor = true;
                leftWall.isSensor = true;
                rightWall.isSensor = true;
                ceiling.isSensor = true;
            }
        }
        createWalls();

        const mouse = Mouse.create(render.canvas);
        const mouseConstraint = MouseConstraint.create(engine, {
            mouse: mouse,
            constraint: { 
                stiffness: 0.2, 
                render: { visible: false }
            }
        });
        Composite.add(world, mouseConstraint);
        render.mouse = mouse;

        window.addEventListener('wheel', (e) => {
            const grabbedBody = mouseConstraint.body;
            // 固定解除中（ドラッグ中）も含めてホイール回転を許可
            if (grabbedBody && (!grabbedBody.isStatic || grabbedBody.isStaticToggle)) {
                const rotationDelta = e.deltaY > 0 ? 0.2 : -0.2;
                Body.rotate(grabbedBody, rotationDelta);
                if (grabbedBody.dragContext) {
                    grabbedBody.dragContext.fixedAngle = grabbedBody.angle;
                }
                Body.setAngularVelocity(grabbedBody, 0);
                e.preventDefault();
            }
        }, { passive: false });

        Events.on(mouseConstraint, 'startdrag', (event) => {
            const body = event.body;
            body.dragContext = { fixedAngle: body.angle };
            lastGrabbedBody = body; 
            
            // 【変更】固定中のオブジェクトをドラッグする場合、一時的に固定を解除する
            if (body.isStaticToggle) {
                Body.setStatic(body, false);
            }
        });

        Events.on(mouseConstraint, 'enddrag', (event) => {
            const body = event.body;
            if (body) {
                body.dragContext = null;
                
                // 【変更】元々固定設定だったものは、ドラッグを終えた瞬間に空中で再度固定する
                if (body.isStaticToggle) {
                    Body.setStatic(body, true);
                    Body.setVelocity(body, { x: 0, y: 0 });
                    Body.setAngularVelocity(body, 0);
                }
            }
        });

        window.addEventListener('keydown', (e) => {
            if (!e || !e.key) return;

            const key = e.key.toLowerCase();
            if (key === 'y') isYKeyPressed = true;
            if (key === 't') isTKeyPressed = true;
            if (key === 'q') {
                if (linkSourceBody || boardSourceBody) {
                    linkSourceBody = null;
                    boardSourceBody = null;
                    playPopSound(200, 'square', 0.05); // キャンセル音
                    if (statusLabel) statusLabel.innerText = "連結の選択をキャンセルしました";
                }
            }
            if (key === 'k') {
                const targetBody = mouseConstraint.body || Matter.Query.point(Composite.allBodies(world), mouse.position)[0];
                if (targetBody) toggleStatic(targetBody);
            }
            if (key === 'b') isBlowing = true;

            // ▼ 【追加】「v」キーで可変バウンドのON/OFF切り替え
            if (key === 'v') {
                toggleVariableBounce();
            }

            if (key === 's' || key === 'n') {
                const grabbedBody = mouseConstraint.body;
                if (grabbedBody && grabbedBody.customText) {
                    grabbedBody.customText.magnet = key.toUpperCase(); 
                    grabbedBody.customText.color = (key === 's') ? "#2196F3" : "#F44336";
                    playPopSound(key === 's' ? 600 : 900, 'square', 0.05);
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            if (!e || !e.key) return; 
            if (e.key.toLowerCase() === 'y') {
        isYKeyPressed = false;
        linkSourceBody = null; // キーを離したら選択リセット
    }
    if (key === 't') { // ★追加
        isTKeyPressed = false;
        boardSourceBody = null;
    }
            if (e.key.toLowerCase() === 'b') isBlowing = false;
        });

        function toggleStatic(targetBody) {
            // 壁などの完全な静的オブジェクト（文字以外）は無視
            if (targetBody.isStatic && !targetBody.isStaticToggle) return;

            if (!targetBody.isStaticToggle) {
                targetBody.isStaticToggle = true;
                if (targetBody.customText) targetBody.customText.opacity = 0.6;
                
                // ドラッグ中でなければ即座に物理的に固定
                if (mouseConstraint.body !== targetBody) {
                    Body.setStatic(targetBody, true);
                }
                playPopSound(300, 'square', 0.05);
            } else if (targetBody.isStaticToggle) {
                targetBody.isStaticToggle = false;
                if (targetBody.customText) targetBody.customText.opacity = 1.0;
                
                // ドラッグ中でなければ即座に物理的固定を解除
                if (mouseConstraint.body !== targetBody) {
                    Body.setStatic(targetBody, false);
                }
                playPopSound(500, 'sine', 0.05);
            }
        }

        function getCharacterData(char, fontSize) {
    let data = { density: 0.001, restitution: 0.4, friction: 0.2, widthFactor: 1.0, type: 'other', magnet: null };
            
            if (char.match(/[a-zA-Z0-9]/) || char.match(/[ａ-ｚＡ-Ｚ０-９]/)) {
                data.widthFactor = 0.5;
                data.density = 0.0007; 
                data.restitution = 0.7; 
                data.friction = 0.05; 
                data.type = 'alphabet';
            }

            if (char === "跳") {
        data.restitution = 1.0; 
        data.type = 'trampoline';
        return data;
    }
    if (char === "浮") {
        data.density = 0.0005;
        data.type = 'float';
        return data;
    }
    if (char === "爆") {
        data.type = 'bomb';
        return data;
    }
    if (char === "倍") {
        data.type = 'multiply';
        data.lastMultiplyTime = Date.now(); // 生成時刻を記録
        return data;
    }

            if (char === "氷") {
                data.friction = 0;      
                data.restitution = 0.1; 
                data.type = 'ice';
                return data;
            }
            if (char === "塊") {
    data.density = 0.05;    
    data.type = 'gravity'; // 塊は単なる重いブロック（※消去フラグは持たせない）
    return data;
}
if (char === "穴" || char === "ブラックホール") { // またはお好みのブラックホール文字
    data.density = 0.01;
    data.isBlackHole = true;   // ここだけ「ブラックホール」のフラグを立てる
    data.type = 'blackhole';
    return data;
}
            if (char === "重"){
                data.density = 1;
                data.friction = 1;
                data.restitution = 0;
                return data;
            }
            if (char === "軽"){
                data.density =0.001;
                data.friction =0;
                data.restitution =1;
                return data;
            }
            if (char === "跳") {
                data.restitution = 1.0; 
                data.type = 'trampoline';
                return data;
            }
            else if (char.match(/[。、！？!?.,]/)) {
                data.density = 0.0008;
                data.restitution = 0.8;
                data.friction = 0.1;
                data.widthFactor = 0.6;
            }
            else if (char.match(/[\u4e00-\u9faf]/)) {
                data.density = 0.005; 
                data.friction = 0.5;
                data.restitution = 0.2;
                data.widthFactor = 1.0;
            }
            return data;
        }

        function addWord(text, xPos, yPos, options = {}) {
            if (!text) return;
            
            const fontSize = options.fontSize || Math.floor(Math.random() * 10) + 45; 
            const charData = getCharacterData(text, fontSize);

            // ★ 【変更】「爆」と「浮」は位置指定がなければ画面下から湧かせる
            const isFromBottom = (charData.type === 'bomb' || charData.type === 'float');
            const x = xPos !== undefined && xPos !== null ? xPos : Math.random() * (width - 100) + 50;
            const y = yPos !== undefined && yPos !== null ? yPos : (isFromBottom ? height + 30 : -50);
            
            const color = isAbyss ? "#ffffff" : "#1a1a1a";
            const w = fontSize * charData.widthFactor;
            const h = fontSize * 0.85;

            const isHalfWidth = text.match(/[a-zA-Z0-9\s!-/:-@[-`{-~]/); 
            const hitWidth = isHalfWidth ? (fontSize * 0.4) : (fontSize * 0.8);

            const wordBody = Bodies.rectangle(x, y, hitWidth, h, { 
                density: charData.density,
                restitution: isAbyss ? 0 : (isBouncing ? 1 : charData.restitution),
                friction: isBouncing ? 0 : charData.friction,
                frictionAir: (isAbyss || isBouncing) ? 0 : 0.01,
                isSensor: false, 
                render: { visible: false }
            });

            if (!isAbyss) Body.setAngle(wordBody, (Math.random() - 0.5) * 0.3);
            else Body.setAngle(wordBody, 0);

            wordBody.customText = {
                content: text,
                size: fontSize,
                color: color,
                opacity: 1.0,
                charData: charData,
                font: options.font || 'serif' ,
                spawnTime: Date.now()
            };

            // ★ 【変更】下から打ち上げる速度を設定
            if (options.velocity) {
                Body.setVelocity(wordBody, options.velocity);
            } else if (charData.type === 'bomb') {
                // 「爆」はロケットのように勢いよく上に射出
                Body.setVelocity(wordBody, { x: (Math.random() - 0.5) * 6, y: -18 });
            } else if (charData.type === 'float') {
                // 「浮」はフワッと上に向かって登っていく
                Body.setVelocity(wordBody, { x: (Math.random() - 0.5) * 3, y: -8 });
            } else if (isAbyss) {
                Body.setVelocity(wordBody, { x: 0, y: ABYSS_FALL_SPEED });
            } else if (isBouncing) {
                const angle = Math.random() * Math.PI * 2;
                Body.setVelocity(wordBody, { x: Math.cos(angle) * BOUNCE_SPEED, y: Math.sin(angle) * BOUNCE_SPEED });
            }

            Composite.add(world, wordBody);
            
            if (!isAbyss) {
                const freq = charData.type === 'alphabet' ? 800 : 600;
                playPopSound(freq, 'sine', 0.05);
            }
            return wordBody;
        }

        // 【機能追加】合体した文字の物理特性を計算して融合する関数
        function getCombinedCharacterData(charsArray, fontSize) {
            let totalDensity = 0, totalRestitution = 0, totalFriction = 0;
            let isBlackHole = false;
            let types = [];
            
            charsArray.forEach(char => {
                let d = getCharacterData(char, fontSize);
                totalDensity += d.density;
                totalRestitution += d.restitution;
                totalFriction += d.friction;
                if (d.isBlackHole) isBlackHole = true;
                types.push(d.type);
            });
            
            let count = charsArray.length || 1;

            // ★ 特殊文字のタイプや文字自体が含まれているかを判定して引き継ぐ
            let combinedType = 'other';
            if (types.includes('bomb') || charsArray.includes('爆')) combinedType = 'bomb';
            else if (types.includes('float') || charsArray.includes('浮')) combinedType = 'float';
            else if (types.includes('trampoline') || charsArray.includes('跳')) combinedType = 'trampoline';
            else if (types.includes('ice') || charsArray.includes('氷')) combinedType = 'ice';
            else if (types.includes('heavy_block') || charsArray.includes('塊')) combinedType = 'heavy_block';
            else if (types.includes('blackhole') || charsArray.includes('吸')) {
                isBlackHole = true;
                combinedType = 'blackhole';
            }

            return {
                density: totalDensity / count,          
                restitution: totalRestitution / count,  
                friction: totalFriction / count,        
                isBlackHole: isBlackHole,               
                type: combinedType                      
            };
        }

        // 【機能追加】合体文字（1つの物理ブロック）を生成する関数
        function addCombinedWord(textStr, xPos, yPos, options = {}) {
            if (!textStr) return null;
            const chars = textStr.split('').slice(0, 4); // 最大4文字まで切り出し
            if (chars.length === 0) return null;

            const fontSize = options.fontSize || Math.floor(Math.random() * 10) + 50; 
            const charData = getCombinedCharacterData(chars, fontSize);

            // ★ 「爆」または「浮」が含まれている場合は画面下から湧かせる
            const isFromBottom = (charData.type === 'bomb' || charData.type === 'float' || chars.includes('爆') || chars.includes('浮'));
            
            const x = xPos !== undefined && xPos !== null ? xPos : Math.random() * (width - 100) + 50;
            const y = yPos !== undefined && yPos !== null ? yPos : (isFromBottom ? height + 30 : -50);
            
            const color = isAbyss ? "#ffffff" : "#1a1a1a";
            const hitSize = fontSize * 0.85;

            const wordBody = Bodies.rectangle(x, y, hitSize, hitSize, { 
                density: charData.density,

                }
                else if (command === "ブラックホール" || text === "ブラックホール") {
                    // ★ 画面中央（width/2, height/2）に巨大なブラックホールを召喚
                    addWord("穴", width / 2, height / 2, { fontSize: 90 });
                    statusLabel.innerText = "ブラックホール発生！";
                    playPopSound(150, 'sawtooth', 0.15);
                }
                else if (command === "全てあなたの所為です" || text === "全てあなたの所為です") {
                    triggerAbyss(true); 
                    addAbyssWords("全てあなたの所為です");
                } 
                else if (command === "深淵" || text === "深淵") {
                    triggerAbyss(false);
                } 
                else if (command === "トランポリン" || text === "トランポリン") {
                    addTrampolineObject("トランポリン");
                } 
                else if (command === "氷床" || text === "氷床") {
                    addIceFloorObject("氷床氷床氷床氷床氷床氷床氷床");
                } 
                else if (isConnectCommand) {
                    if (text) {
                        let connectedBody = addConnectedObject(text, font);
                        if (connectedBody) createdBodies.push({ first: connectedBody, last: connectedBody });
                    }
                } 
                else if (isChainCommand || command === "鎖" || command === "つなげる") {
                    const textToChain = text || "鎖鎖鎖鎖";
                    const chainResult = addChain(textToChain, font);
                    if (chainResult) createdBodies.push({ first: chainResult.first, last: chainResult.last });
                } 
                else if (text) {
                    if (isAbyss) {
                        addAbyssWords(text);
                    } else {
                        text.split('').forEach((char, i) => {
                            setTimeout(() => addWord(char, null, null, { font: font }), i * 100);
                        });
                    }
                }
            });

            // (連結処理の末尾などは既存通り)
            input.value = '';
        }

        addBtn.onclick = handleAdd;
        input.onkeypress = (e) => { if (e.key === 'Enter') handleAdd(); };
        
        clearBtn.onclick = () => {
            const allConstraints = Composite.allConstraints(world);
            allConstraints.forEach(constraint => {
                Composite.remove(world, constraint);
            });

            const toRemove = Composite.allBodies(world).filter(b => !b.isStatic || b.isStaticToggle);
            Composite.remove(world, toRemove);

            if (Composite.allConstraints(world).indexOf(mouseConstraint) === -1) {
                Composite.add(world, mouseConstraint);
            }

            playPopSound(200, 'square', 0.1);
        };

        backBtn.onclick = () => {
            isAbyss = false;
            isBouncing = false;
            document.body.className = "normal-mode";
            document.body.classList.remove('zero-gravity-mode'); // ★ クラスを解除
            engine.gravity.y = 1.0;
            if (ground) ground.isSensor = false;
            statusLabel.innerText = "掴んでホイール回転 / 英字は軽快に跳ねる / 「k」固定 / 「b」風";
            
            Composite.allBodies(world).forEach(body => {
                if (body.customText) {
                    body.customText.color = "#1a1a1a";
                    body.isSensor = false;
                }
            });
            playPopSound(400);
        };

        function addFloatStoppedObject(text) {
            const x = Math.random() * (width - 200) + 100;
            const y = height / 2; // 画面の中央付近に出現
            const fontSize = 55;
            const w = fontSize * text.length * 0.8;
            const h = fontSize * 1.2;

            const body = Bodies.rectangle(x, y, w, h, {
                density: 0.001,
                restitution: 0.4,
                friction: 0.2,
                render: { visible: false }
            });

            body.customText = {
                content: text,
                size: fontSize,
                color: isAbyss ? "#ffffff" : "#1a1a1a",
                opacity: 1.0,
                charData: { type: 'float_stopped' }, // ★ 最初は止まっているタイプ
                font: 'serif'
            };

            Composite.add(world, body);
            playPopSound(500, 'sine', 0.1);
        }

        const randomChars = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをんABCDEFGabcdefg0123456789漢字所為跳躍深淵回転固定フロクロ方眼紙原稿用紙JavaScriptジャバスクリプトカタカナひらがなalphabet記号";
        render.canvas.addEventListener('mousedown', (e) => {
            const mousePos = mouse.position;
            const bodiesAtPoint = Matter.Query.point(Composite.allBodies(world), mousePos);

            // 【Yキー押しながらクリックで「たるむ紐」連結】
            if (isYKeyPressed && bodiesAtPoint.length > 0) {
                const clickedBody = bodiesAtPoint[0];
                if (!linkSourceBody) {
                    linkSourceBody = clickedBody;
                    statusLabel.innerText = "紐で繋ぐ2つ目の文字をクリックしてください (qでキャンセル)";
                    playPopSound(700, 'sine', 0.05);
                } else if (linkSourceBody !== clickedBody) {
                    const dist = Vector.magnitude(Vector.sub(linkSourceBody.position, clickedBody.position));
                    const ropeLength = dist + 30; // 初期の長さにゆとりを持たせる

                    const constraint = Matter.Constraint.create({
                        bodyA: linkSourceBody,
                        bodyB: clickedBody,
                        stiffness: 0.9,
                        length: ropeLength,
                        render: { visible: false } // カスタム描画するためオフ
                    });

                    constraint.isRope = true;
                    constraint.maxLength = ropeLength;

                    Composite.add(world, constraint);
                    playPopSound(1000, 'sine', 0.08);
                    linkSourceBody = null; // 連結完了したらリセット
                    statusLabel.innerText = "通常モード";
                }
                return;
            }
            if (e.button === 0 && bodiesAtPoint.length > 0) {
                const clickedBody = bodiesAtPoint[0];
                if (clickedBody.customText && clickedBody.customText.charData.type === 'float_stopped') {
                    clickedBody.customText.charData.type = 'float'; // 浮上モードに変更！
                    playPopSound(800, 'sine', 0.08);
                    statusLabel.innerText = "「浮」が浮き始めました！";
                    return; // 続けて他の処理が走らないようにする
                }
            }

            // 【Tキー押しながらクリックで「板」連結】
            if (isTKeyPressed && bodiesAtPoint.length > 0) {
                const clickedBody = bodiesAtPoint[0];
                if (!boardSourceBody) {
                    boardSourceBody = clickedBody;
                    statusLabel.innerText = "板で繋ぐ2つ目の文字をクリックしてください (qでキャンセル)";
                    playPopSound(600, 'square', 0.05);
                } else if (boardSourceBody !== clickedBody) {
                    const dist = Vector.magnitude(Vector.sub(boardSourceBody.position, clickedBody.position));

                    const c1 = Matter.Constraint.create({
                        bodyA: boardSourceBody,
                        bodyB: clickedBody,
                        stiffness: 0.95,
                        length: dist,
                        render: { visible: true, strokeStyle: '#a1887f', lineWidth: 14 }
                    });
                    const c2 = Matter.Constraint.create({
                        bodyA: boardSourceBody,
                        bodyB: clickedBody,
                        pointA: { x: 10, y: 10 },
                        pointB: { x: 10, y: 10 },
                        stiffness: 0.95,
                        length: dist,
                        render: { visible: false }
                    });

                    Composite.add(world, [c1, c2]);
                    playPopSound(400, 'square', 0.1);
                    boardSourceBody = null; // 連結完了したらリセット
                    statusLabel.innerText = "通常モード";
                }
                return;
            }

    // （以下、既存の右クリック削除・文字追加処理...）
            if (e.button === 0 && bodiesAtPoint.length === 0) {
                lastGrabbedBody = null;
            }

            if (e.button === 2) {
                bodiesAtPoint.forEach(body => {
                    if (!body.isStatic || body.isStaticToggle) {
                        // 1. このボディに接続されている紐や板などの制約（Constraint）をすべて探し、ワールドから削除する
                        const allConstraints = Composite.allConstraints(world);
                        allConstraints.forEach(constraint => {
                            if (constraint.bodyA === body || constraint.bodyB === body) {
                                Composite.remove(world, constraint);
                            }
                        });
                        
                        // 2. ボディ本体をワールドから削除する
                        Composite.remove(world, body);

                        // 3. マウスの掴み状態や直前に掴んでいたボディの参照も綺麗にクリアする
                        if (mouseConstraint.body === body) mouseConstraint.body = null;
                        if (lastGrabbedBody === body) lastGrabbedBody = null;

                        playPopSound(200, 'square', 0.05);
                    }
                });
                return;
            }
            // ▼【修正】クリックした位置に何もオブジェクトがない場合（bodiesAtPoint.length === 0）のみ文字を生成
            setTimeout(() => {
                if (bodiesAtPoint.length === 0 && !mouseConstraint.body && !isAbyss && e.button === 0) {
                    const char = randomChars[Math.floor(Math.random() * randomChars.length)];
                    addWord(char, mousePos.x, mousePos.y);
                }
            }, 30);
        });
        
        window.addEventListener('resize', () => {
            width = window.innerWidth; height = window.innerHeight;
            render.canvas.width = width; render.canvas.height = height;
            createWalls();
        });

        window.onload = () => {
            "Physics".split('').forEach((c, i) => {
                setTimeout(() => addWord(c), i * 150 + 600);
            });
        };
        
        function addTrampolineObject(text) {
            const x = Math.random() * (width - 200) + 100;
            const y = -50;
            const fontSize = 60;
            const w = fontSize * 6; 
            const h = fontSize * 1.2;

            const trampBody = Bodies.rectangle(x, y, w, h, {
                restitution: 0.8,
                friction: 0.1,
                label: 'special_trampoline',
                render: { visible: false }
            });

            trampBody.customText = {
                content: text,
                size: fontSize,
                color: "#000000", 
                opacity: 1.0,
                charData: { type: 'other' }
            };

            Composite.add(world, trampBody);
            playPopSound(400, 'square', 0.1);
        }

        // 引数に font = 'serif' を追加します
        function addChain(text, font = 'serif') {
            const chars = text.split('');
            const fontSize = 50;
            const startX = Math.random() * (width - 200) + 100;
            const startY = 100; 
            
            let lastBody = null;
            let firstBody = null;

            chars.forEach((char, i) => {
                const currentY = startY + (i * (fontSize + 10));
                // フォント設定をaddWordへ渡す
                const body = addWord(char, startX, currentY, { fontSize: fontSize, font: font }); 

                if (i === 0) firstBody = body;

                if (lastBody && body) {
                    const constraint = Matter.Constraint.create({
                        bodyA: lastBody,
                        bodyB: body,
                        pointA: { x: 0, y: fontSize / 2 },
                        pointB: { x: 0, y: -fontSize / 2 },
                        stiffness: 0.4,
                        length: 5,
                        render: {
                            visible: true,
                            strokeStyle: isAbyss ? '#ffffff' : '#8d6e63',
                            lineWidth: 3
                        }
                    });
                    Composite.add(world, constraint);
                }
                lastBody = body;
            });
            playPopSound(600, 'sine', 0.1);

            // 先頭の文字と末尾の文字をオブジェクトで返す
            return { first: firstBody, last: lastBody };
        }

        function addIceFloorObject(text) {
            const fontSize = 55;
            const w = fontSize * 14; 
            const h = fontSize * 1.5; 
            const x = Math.random() * (width - w) + w / 2;
            const y = 100;

            const iceBody = Bodies.rectangle(x, y, w, h, {
                restitution: 0.1,
                friction: 0,
                frictionStatic: 0, 
                frictionAir: 0.001,
                label: 'ice_floor',
                render: { visible: false }
            });

            iceBody.customText = {
                content: text,
                size: fontSize,
                color: "#000000",
                charData: { type: 'ice' }
            };

            Composite.add(world, iceBody);
        }

        function addConnectedObject(text, font = 'serif') {
            const fontSize = 55;
            const w = fontSize * text.length * 0.8; 
            const h = fontSize * 1.2;
            const x = Math.random() * (width - w) + w / 2;
            const y = -50;

            const connectedBody = Bodies.rectangle(x, y, w, h, {
                restitution: 0.4,
                friction: 0.2,
                label: 'connected_object',
                render: { visible: false }
            });

            connectedBody.customText = {
                content: text,
                size: fontSize,
                color: isAbyss ? "#ffffff" : "#1a1a1a",
                charData: { type: 'other' },
                font: font 
            };

            Composite.add(world, connectedBody);
            playPopSound(500, 'sine', 0.1);

            // ▼ここを追加！ 生成したオブジェクトを返します
            return connectedBody;
        }

        vkToggleBtn.addEventListener('click', () => {
            virtualKeyboard.classList.toggle('hidden');
            playPopSound(500, 'sine', 0.05);
        });

        function getTargetBody() {
            return mouseConstraint.body || lastGrabbedBody;
        }

        document.getElementById('vk-fix').addEventListener('click', () => {
            const targetBody = getTargetBody();
            if (targetBody) toggleStatic(targetBody);
        });

        document.getElementById('vk-delete').addEventListener('click', () => {
            const targetBody = getTargetBody();
            if (targetBody && (!targetBody.isStatic || targetBody.isStaticToggle)) {
                const allConstraints = Composite.allConstraints(world);
                allConstraints.forEach(constraint => {
                    if (constraint.bodyA === targetBody || constraint.bodyB === targetBody) {
                        Composite.remove(world, constraint);
                    }
                });
                Composite.remove(world, targetBody);
                playPopSound(200, 'square', 0.05);
                
                if (mouseConstraint.body === targetBody) mouseConstraint.body = null;
                if (lastGrabbedBody === targetBody) lastGrabbedBody = null;
            }
        });

        document.getElementById('vk-s').addEventListener('click', () => {
            const targetBody = getTargetBody();
            if (targetBody && targetBody.customText) {
                targetBody.customText.magnet = 'S';
                targetBody.customText.color = "#2196F3";
                playPopSound(600, 'square', 0.05);
            }
        });

        document.getElementById('vk-n').addEventListener('click', () => {
            const targetBody = getTargetBody();
            if (targetBody && targetBody.customText) {
                targetBody.customText.magnet = 'N';
                targetBody.customText.color = "#F44336";
                playPopSound(900, 'square', 0.05);
            }
        });

        // 回転ボタン（左・右）の追加
        function rotateBody(delta) {
            const targetBody = getTargetBody();
            if (targetBody && (!targetBody.isStatic || targetBody.isStaticToggle)) {
                Body.rotate(targetBody, delta);
                if (targetBody.dragContext) {
                    targetBody.dragContext.fixedAngle = targetBody.angle;
                }
                Body.setAngularVelocity(targetBody, 0);
                playPopSound(500, 'sine', 0.05);
            }
        }

        if (shouldLinkGroups && createdBodies.length >= 2) {
                for (let i = 0; i < createdBodies.length - 1; i++) {
                    const prevGroup = createdBodies[i];
                    const nextGroup = createdBodies[i + 1];

                    const constraint = Matter.Constraint.create({
                        bodyA: prevGroup.last,
                        bodyB: nextGroup.first,
                        pointA: { x: 0, y: 20 },
                        pointB: { x: 0, y: -20 },
                        stiffness: 0.9,
                        length: 60, // ゆとりのある長さ
                        render: { visible: false }
                    });
                    
                    constraint.isRope = true;
                    constraint.maxLength = 60;

                    Composite.add(world, constraint);
                }
            }
        document.getElementById('vk-rotate-left').addEventListener('click', () => rotateBody(-0.2));
        document.getElementById('vk-rotate-right').addEventListener('click', () => rotateBody(0.2));

        const btnWind = document.getElementById('vk-wind');
        const startWind = (e) => { e.preventDefault(); isBlowing = true; };
        const stopWind = (e) => { e.preventDefault(); isBlowing = false; };
        
        btnWind.addEventListener('pointerdown', startWind);
        btnWind.addEventListener('pointerup', stopWind);
        btnWind.addEventListener('pointerleave', stopWind);
        btnWind.addEventListener('pointercancel', stopWind);

        document.getElementById('multiplySpeed')?.addEventListener('input', (e) => {
    document.getElementById('speedValue').innerText = e.target.value;
});

// バーチャルキーボード：Tボタン（板で連結）
document.getElementById('vk-board')?.addEventListener('click', () => {
    isTKeyPressed = !isTKeyPressed; // タップでON/OFF切り替え
    isYKeyPressed = false;          // 紐モードは解除

    if (isTKeyPressed) {
        statusLabel.innerText = "【板連結モード】繋ぎたい2つの文字を順番にタップしてください";
        playPopSound(600, 'square', 0.05);
    } else {
        boardSourceBody = null;
        statusLabel.innerText = "通常モード";
        playPopSound(300, 'square', 0.05);
    }
});

document.getElementById('vk-board')?.addEventListener('click', () => {
    isYKeyPressed = !isYKeyPressed; // タップでON/OFF切り替え
    isTKeyPressed = false;          // 紐モードは解除

    if (isYKeyPressed) {
        statusLabel.innerText = "【紐連結モード】繋ぎたい2つの文字を順番にタップしてください";
        playPopSound(600, 'square', 0.05);
    } else {
        boardSourceBody = null;
        statusLabel.innerText = "通常モード";
        playPopSound(300, 'square', 0.05);
    }
});

// バーチャルキーボード：Qボタン（選択解除・キャンセル）
document.getElementById('vk-cancel')?.addEventListener('click', () => {
    linkSourceBody = null;
    boardSourceBody = null;
    isYKeyPressed = false;
    isTKeyPressed = false;
    statusLabel.innerText = "連結の選択をキャンセルしました";
    playPopSound(200, 'square', 0.05);
});

    </script>
</body>
</html>
